<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Montserrat:wght@300;400;500;600&amp;family=Alexandria:wght@300;400;500&amp;display=swap');
      .dark-stacked-title {
        font-family: 'Cormorant Garamond', 'Bodoni MT', 'Didot', 'Playfair Display', serif;
        font-size: 46px;
        font-weight: 400;
        letter-spacing: 0.35em;
        fill: #F5F0E8;
        text-anchor: middle;
      }
      .dark-stacked-desc {
        font-family: 'Montserrat', 'Helvetica Neue', 'Arial', sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.55em;
        fill: #DCC8AC;
        text-anchor: middle;
      }
      .dark-stacked-slogan {
        font-family: 'Cormorant Garamond', serif;
        font-size: 14px;
        font-style: italic;
        letter-spacing: 0.22em;
        fill: #DCC8AC;
        opacity: 0.85;
        text-anchor: middle;
      }
      .dark-stacked-arabic {
        font-family: 'Alexandria', 'Amiri', 'Traditional Arabic', serif;
        font-size: 12.5px;
        font-weight: 400;
        letter-spacing: 0.08em;
        fill: #DCC8AC;
        opacity: 0.85;
        text-anchor: middle;
      }
      .dark-stacked-ring { fill: none; stroke: #DCC8AC; stroke-width: 1.2; }
      .dark-stacked-inner-ring { fill: none; stroke: #F5F0E8; stroke-width: 0.6; opacity: 0.35; stroke-dasharray: 2 3; }
      .dark-stacked-stem { fill: #F5F0E8; }
      .dark-stacked-accent { fill: #DCC8AC; }
    </style>
  </defs>

  <!-- Top Center: Luxury Monogram Seal (Scale: 0.60, centered at x=300, y=90) -->
  <g transform="translate(240, 30) scale(0.60)">
    <!-- Medallion Rings -->
    <circle class="dark-stacked-ring" cx="100" cy="100" r="92" />
    <circle class="dark-stacked-inner-ring" cx="100" cy="100" r="86" />

    <!-- Cardinal Diamond Accents -->
    <polygon class="dark-stacked-accent" points="100,4 102.5,8 100,12 97.5,8" />
    <polygon class="dark-stacked-accent" points="100,188 102.5,192 100,196 97.5,192" />
    <polygon class="dark-stacked-accent" points="4,100 8,97.5 12,100 8,102.5" />
    <polygon class="dark-stacked-accent" points="188,100 192,97.5 196,100 192,102.5" />

    <!-- HN Monogram Ligature -->
    <g transform="translate(0, -2)">
      <path class="dark-stacked-accent" d="M 100,38 L 102.2,44 L 108.5,46.2 L 102.2,48.4 L 100,54.5 L 97.8,48.4 L 91.5,46.2 L 97.8,44 Z" />
      
      <!-- Stem 1: Left H -->
      <path class="dark-stacked-stem" d="M 52,56 C 56,56 59,57 60,60 L 61,62 L 67,62 L 68,60 C 69,57 72,56 76,56 L 76,53 L 52,53 Z" />
      <rect class="dark-stacked-stem" x="61" y="60" width="6.5" height="74" />
      <path class="dark-stacked-stem" d="M 52,138 L 52,141 L 76,141 L 76,138 C 72,138 69,137 68,134 L 67,132 L 61,132 L 60,134 C 59,137 56,138 52,138 Z" />

      <!-- Crossbar H -->
      <rect class="dark-stacked-stem" x="67.5" y="94.5" width="29" height="4.5" />

      <!-- Stem 2: Shared Center (H & N) -->
      <path class="dark-stacked-stem" d="M 88,56 C 92,56 95,57 96,60 L 96.5,62 L 103.5,62 L 104,60 C 105,57 108,56 112,56 L 112,53 L 88,53 Z" />
      <rect class="dark-stacked-stem" x="96.5" y="60" width="7" height="74" />
      <path class="dark-stacked-stem" d="M 88,138 L 88,141 L 112,141 L 112,138 C 108,138 105,137 104,134 L 103.5,132 L 96.5,132 L 96,134 C 95,137 92,138 88,138 Z" />

      <!-- Diagonal N -->
      <polygon class="dark-stacked-stem" points="98,59 108,59 139,134 130,134" />
      <line x1="102" y1="62" x2="135" y2="132" stroke="#DCC8AC" stroke-width="0.8" opacity="0.8" />

      <!-- Stem 3: Right N -->
      <path class="dark-stacked-stem" d="M 125,56 C 128,56 131,57 132,60 L 133,62 L 139,62 L 140,60 C 141,57 144,56 148,56 L 148,53 L 125,53 Z" />
      <rect class="dark-stacked-stem" x="133" y="60" width="6" height="74" />
      <path class="dark-stacked-stem" d="M 125,138 L 125,141 L 148,141 L 148,138 C 144,138 141,137 140,134 L 139,132 L 133,132 L 132,134 C 131,137 128,138 125,138 Z" />
    </g>
  </g>

  <!-- Brand Wordmark Typography: HAS NAA -->
  <text class="dark-stacked-title" x="300" y="222">HAS NAA</text>

  <!-- Hairline Geometric Rule with Diamond Accent -->
  <line x1="210" y1="242" x2="390" y2="242" stroke="#DCC8AC" stroke-width="0.9" opacity="0.85" />
  <polygon fill="#DCC8AC" points="300,239 303,242 300,245 297,242" />

  <!-- Descriptor: WOMEN'S FASHION -->
  <text class="dark-stacked-desc" x="300" y="272">WOMEN'S FASHION</text>

  <!-- Slogan: Elegance in Every Detail -->
  <text class="dark-stacked-slogan" x="300" y="315">Elegance in Every Detail</text>

  <!-- Arabic Heritage Typography: الأناقة في أدق التفاصيل -->
  <text class="dark-stacked-arabic" x="300" y="352">الأناقة في أدق التفاصيل</text>

  <!-- Subtle Footnote Finial -->
  <circle cx="285" cy="382" r="1.5" fill="#DCC8AC" opacity="0.85" />
  <line x1="292" y1="382" x2="308" y2="382" stroke="#DCC8AC" stroke-width="0.75" opacity="0.85" />
  <circle cx="315" cy="382" r="1.5" fill="#DCC8AC" opacity="0.85" />
</svg>
